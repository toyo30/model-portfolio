<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080808" />
  <meta name="description" content="Mélinda — photographic model portfolio." />
  <title>Mélinda — Portfolio</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='12' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
  <script src="./main.js" defer></script>
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"><span id="scroll-progress-fill"></span></div>
  <nav class="scene-nav" aria-label="Portfolio navigation">
    <a href="#experience" class="nav-dot is-active" aria-label="View photographs" aria-current="location"></a>
    <a href="#measurements" class="nav-dot" aria-label="View body measurements"></a>
  </nav>
  <main>
    <section id="experience" class="experience" aria-label="Photographic portfolio">
      <div class="story-viewport">
        <div class="ambient" aria-hidden="true"></div>
        <div id="story-cards" class="story-cards"></div>
        <a class="scroll-cue" href="#measurements" aria-label="Scroll to body measurements"><span></span></a>
      </div>
    </section>
    <section id="measurements" class="measurements-section" aria-label="Body measurements">
      <dl class="measurements">
        <div><dt>Height</dt><dd>162 <small>cm</small></dd></div>
        <div><dt>Bust</dt><dd>85 <small>cm</small></dd></div>
        <div><dt>Waist</dt><dd>65 <small>cm</small></dd></div>
        <div><dt>Hips</dt><dd>92 <small>cm</small></dd></div>
        <div><dt>Shoes</dt><dd>38 <small>EU</small></dd></div>
        <div><dt>Hair</dt><dd class="text-value">Dark brown</dd></div>
        <div><dt>Eyes</dt><dd class="text-value">Dark brown</dd></div>
      </dl>
      <a class="back-top" href="#experience" aria-label="Back to first photograph">↑</a>
    </section>
  </main>
  <noscript><style>.experience{display:none}</style><div class="fallback-photo"><img src="./public/images/01.webp" alt="Black and white portrait of Mélinda" /></div></noscript>
</body>
</html>
